name: Documentation checks

on:
  push:
    paths:
      - "**/*.md"
      - "**/*.yml"
      - "**/*.yaml"
      - ".editorconfig"
      - "assets/**"
  pull_request:
    paths:
      - "**/*.md"
      - "**/*.yml"
      - "**/*.yaml"
      - ".editorconfig"
      - "assets/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required repository files
        shell: bash
        run: |
          set -euo pipefail
          for file in README.md LICENSE CHANGELOG.md CONTRIBUTING.md CODE_OF_CONDUCT.md SECURITY.md docs/ROADMAP.md docs/PRODUCT.md; do
            test -s "$file" || { echo "Missing or empty: $file"; exit 1; }
          done
          grep -q '## \[Unreleased\]' CHANGELOG.md
          test -s assets/logo.svg
          test -s assets/icon.svg
          echo "Required documentation and brand assets found."
